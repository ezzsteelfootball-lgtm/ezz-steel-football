let currentTeam = 0;

function changeTeam(direction) {

    currentTeam += direction;

    if (currentTeam >= teams.length) {
        currentTeam = 0;
    }

    if (currentTeam < 0) {
        currentTeam = teams.length - 1;
    }

    const team = teams[currentTeam];

    document.getElementById("team-logo").src = team.logo;
    document.getElementById("team-name").textContent = team.name;

    document.getElementById("goals").textContent = team.goals;
    document.getElementById("yellow").textContent = team.yellow;
    document.getElementById("red").textContent = team.red;

    const playersList = document.getElementById("players-list");

    playersList.innerHTML = "";

    team.players.forEach(player => {

        playersList.innerHTML += `
            <div class="scorer-info">

                <div>
                    <h4>${player.name}</h4>
                    <p>Top Scorer</p>
                </div>

                <strong>${player.goals} Goals</strong>

            </div>
        `;

    });

}
